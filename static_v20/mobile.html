<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2452">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>판례 리더</title>
<style>
/* ================= 판례 리더 (모바일 전용, 2026-08-09) =================
   법제처 대시보드(6155)의 API 위에 폰 가독성 최우선으로 새로 설계한 리더.
   화면: 홈(검색·최근) / 문서(판례·법령) / 노트. 스택 내비 + 폰 뒤로가기 지원. */
:root{
  --fs:17px;
  --bg:#f4f5f8;--card:#fff;--ink:#1a1d26;--dim:#6a7183;--line:#e5e7ee;
  --acc:#3b47c4;--acc-ink:#fff;--acc-soft:#eceffc;--green:#0f8a66;--green-soft:#e9f7f1;
  --amber:#b45309;--amber-soft:#fdf3e0;--purple:#6941c6;--purple-soft:#f3eefc;
  --cyan:#0e7490;
  --top:#1d2452;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171d;--card:#1e2129;--ink:#e8eaf0;--dim:#98a0b3;--line:#30343f;
  --acc:#8b95f2;--acc-ink:#141936;--acc-soft:#272c45;--green:#4cc9a4;--green-soft:#1f3229;
  --amber:#e5a558;--amber-soft:#33291a;--purple:#b197e8;--purple-soft:#2c2440;
  --cyan:#67d3e0;
  --top:#141936;
}}
html.dark:root,html.dark{--bg:#15171d;--card:#1e2129;--ink:#e8eaf0;--dim:#98a0b3;--line:#30343f;
  --acc:#8b95f2;--acc-ink:#141936;--acc-soft:#272c45;--green:#4cc9a4;--green-soft:#1f3229;
  --amber:#e5a558;--amber-soft:#33291a;--purple:#b197e8;--purple-soft:#2c2440;--cyan:#67d3e0;--top:#141936}
html.light:root,html.light{--bg:#f4f5f8;--card:#fff;--ink:#1a1d26;--dim:#6a7183;--line:#e5e7ee;
  --acc:#3b47c4;--acc-ink:#fff;--acc-soft:#eceffc;--green:#0f8a66;--green-soft:#e9f7f1;
  --amber:#b45309;--amber-soft:#fdf3e0;--purple:#6941c6;--purple-soft:#f3eefc;--cyan:#0e7490;--top:#1d2452}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:var(--fs);line-height:1.85;overscroll-behavior-y:contain}
#top{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--top);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;min-height:52px}
#top .tbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;
  padding:7px 12px;font-size:15px;font-weight:700;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
#topTitle{flex:1;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{padding:calc(env(safe-area-inset-top) + 66px) 0 calc(env(safe-area-inset-bottom) + 76px)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:var(--dim);font-size:12px;font-weight:700;
  padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button.on{color:var(--acc)}
#nav .ic{font-size:21px;line-height:1}
.wrap{padding:0 14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;
  box-shadow:0 1px 3px rgba(10,15,40,.05)}
.tap{cursor:pointer}
.tap:active{transform:scale(.985);opacity:.9}
h2.sec{font-size:14px;color:var(--dim);font-weight:800;margin:20px 2px 6px;letter-spacing:.3px}
/* ── 검색 ── */
#q{width:100%;font-size:17px;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--acc)}
.chips{display:flex;gap:7px;margin:10px 0 2px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;
  padding:6px 13px;font-size:13.5px;font-weight:700;position:relative;min-height:38px}
.chip::after{content:'';position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.hit .t{font-weight:700;font-size:16px;line-height:1.5}
.hit .m{color:var(--dim);font-size:13px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11.5px;font-weight:800;border-radius:7px;padding:1px 7px}
.b-prec{background:var(--purple-soft);color:var(--purple)}
.b-law{background:var(--acc-soft);color:var(--acc)}
.b-sim{background:var(--amber-soft);color:var(--amber)}
.b-etc{background:var(--green-soft);color:var(--green)}
.empty{color:var(--dim);text-align:center;padding:34px 10px;font-size:15px}
/* ── 문서(판례) ── */
.docHead{background:linear-gradient(135deg,var(--top),#3b47c4);color:#fff;border-radius:18px;
  padding:16px 18px;margin:10px 0 14px}
.docHead .no{font-size:20px;font-weight:900;letter-spacing:.3px}
.docHead .nm{font-size:15px;opacity:.95;margin-top:2px;line-height:1.5}
.docHead .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.docHead .mt span{background:rgba(255,255,255,.16);border-radius:8px;padding:2px 9px;font-size:12.5px;font-weight:700}
.docBtns{display:flex;gap:8px;margin:0 0 6px}
.docBtns button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:10px 6px;font-size:14px;font-weight:700}
.docBtns button.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.secCard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.secCard>.hd{padding:11px 16px;font-weight:800;font-size:15px;background:var(--acc-soft);color:var(--acc);
  display:flex;justify-content:space-between;align-items:center}
.secCard>.bd{padding:6px 16px 14px}
.secCard.fold>.bd{display:none}
.secCard>.hd .arw{font-size:12px;opacity:.7}
.sent{margin:13px 0}
.pnum{display:inline-block;font-weight:900;color:var(--acc-ink);background:var(--acc);border-radius:9px;
  padding:1px 9px;font-size:14px;margin-right:5px}
.cite{color:var(--purple)}
.cl{color:var(--cyan);border-bottom:1.5px dashed var(--cyan);font-weight:600}
.ll{color:var(--acc);border-bottom:1.5px dashed var(--acc);font-weight:600}
.jl{color:var(--green);border-bottom:1.5px dashed var(--green);font-weight:600}
/* ── 법령 ── */
.artFilter{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:10;background:var(--bg);padding:8px 0}
.artFilter input{width:100%;font-size:15.5px;padding:11px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
details.art{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
details.art summary{list-style:none;padding:12px 15px;font-weight:700;font-size:15.5px;display:flex;gap:8px}
details.art summary::-webkit-details-marker{display:none}
details.art summary .no{color:var(--acc);font-weight:900;flex:0 0 auto}
details.art[open] summary{border-bottom:1px solid var(--line);background:var(--acc-soft)}
details.art .bd{padding:4px 16px 14px;font-size:calc(var(--fs) - 1px)}
details.art .bd .u{margin:10px 0}
/* ── 노트 ── */
.nvSec{font-size:15.5px;font-weight:800;margin:20px 0 8px;padding:7px 12px;border-left:4px solid var(--acc);
  background:var(--acc-soft);border-radius:0 10px 10px 0}
.nvLead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0 12px}
.nvItem{display:flex;gap:9px;margin:15px 0 4px;align-items:flex-start}
.nvNum{flex:0 0 auto;font-weight:900;color:var(--acc-ink);background:var(--acc);border-radius:9px;padding:1px 8px;font-size:14px;margin-top:3px}
.nvExp{margin:5px 0 5px 32px;padding:8px 12px;border-left:3px solid var(--green);background:var(--green-soft);
  border-radius:0 10px 10px 0;font-size:calc(var(--fs) - 2px)}
.nvFlow{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:12px 15px;margin:8px 0;
  font-size:calc(var(--fs) - 2px);line-height:2.1}
.nvTake{margin:6px 0;padding:9px 12px;background:var(--amber-soft);border:1px solid transparent;border-radius:10px;
  font-size:calc(var(--fs) - 2px)}
.nvQuote{color:var(--purple)}
.nvGap{height:6px}.nvP{margin:6px 0}
.noteCard{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px 17px;margin:12px 0}
.noteCard .ti{font-weight:800;font-size:16px;line-height:1.5;margin-bottom:4px}
.noteCard .meta{font-size:12.5px;color:var(--dim);margin-bottom:8px}
.noteCard .nq{font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:10px;padding:9px 12px;margin:6px 0 10px;font-size:calc(var(--fs) - 1px)}
/* ── 공통 ── */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);
  background:#222c;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .25s;
  pointer-events:none;z-index:99;max-width:86vw;text-align:center}
#load{position:fixed;inset:0;background:rgba(10,12,25,.35);display:none;z-index:98;align-items:center;justify-content:center}
#load .sp{background:var(--card);color:var(--ink);border-radius:16px;padding:16px 24px;font-weight:700;font-size:15px}
mark{background:#ffe9a8;color:#4a3705;border-radius:3px;padding:0 2px}
.mini{font-size:12.5px;color:var(--dim)}
</style>
</head>
<body>
<div id="top">
  <button class="tbtn" id="backBtn" onclick="goBack()" style="display:none">←</button>
  <div id="topTitle">판례 리더</div>
  <button class="tbtn" onclick="fontStep(-1)">A-</button>
  <button class="tbtn" onclick="fontStep(1)">A+</button>
  <button class="tbtn" onclick="toggleDark()">◐</button>
</div>
<div id="app"></div>
<div id="nav">
  <button id="nb-home" onclick="navTo('home')"><span class="ic">🔍</span>검색</button>
  <button id="nb-files" onclick="navTo('files')"><span class="ic">📚</span>자료</button>
  <button id="nb-recent" onclick="navTo('recent')"><span class="ic">🕘</span>최근</button>
  <button id="nb-notes" onclick="navTo('allnotes')"><span class="ic">📝</span>노트</button>
</div>
<div id="toast"></div>
<div id="load"><div class="sp">불러오는 중…</div></div>

<script>
'use strict';
/* ============================ 유틸 ============================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,ms||2200);}
function loading(on){$('load').style.display=on?'flex':'none';}
async function api(path,params){
  const u=path+'?'+new URLSearchParams(params||{});
  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch(u,{signal:ac.signal});
    if(!r.ok)throw new Error('서버 오류 '+r.status);
    return await r.json();
  }catch(e){throw (e&&e.name==='AbortError')?new Error('요청 시간 초과(15초)'):e;}
  finally{clearTimeout(tm);}
}
/* 글자 크기 / 다크 */
function fontStep(d){
  let v=(parseInt(localStorage.mob_fs||'17',10)||17)+d;v=Math.max(14,Math.min(24,v));
  localStorage.mob_fs=v;document.documentElement.style.setProperty('--fs',v+'px');toast('글자 '+v+'px');
}
function toggleDark(){
  const h=document.documentElement;
  const cur=h.classList.contains('dark')?'dark':(h.classList.contains('light')?'light':'auto');
  const nxt=cur==='auto'?'dark':(cur==='dark'?'light':'auto');
  h.classList.remove('dark','light');if(nxt!=='auto')h.classList.add(nxt);
  localStorage.mob_theme=nxt;toast(nxt==='auto'?'시스템 테마':'테마: '+(nxt==='dark'?'어두움':'밝음'));
}
(function(){ // 초기 설정 복원
  const v=parseInt(localStorage.mob_fs||'17',10);if(v)document.documentElement.style.setProperty('--fs',v+'px');
  const t=localStorage.mob_theme;if(t==='dark'||t==='light')document.documentElement.classList.add(t);
})();

/* ============================ 인용 링크 (데스크톱 검증판 이식) ============================ */
const CASE_RE=/(조심\s?)?(?<!제)(\d{2,4})(누|두|구합|구단|구|다|도|허|지|부|서|중|광|전|대|가합|가단|나|카|마|바|재|헌[가-사]|심사|감심)(\d{1,6})(?![\d가-힣])/g;
const LAW_RE=/(구\s+)?((?:[가-힣]{2,24}?(?:기본법|특례법|촉진법|처벌법|세법|소송법|등기법|보상법|법률|규칙|조례|법))|같은\s*법|같은법|동\s*법|이\s*법)?(시행령|시행규칙|\s+시행령|\s+시행규칙)?(\s*\(([^)<]{0,70}?)개정되기\s*전의\s*것\))?\s*(제\d{1,4}조(?:의\d{1,3})?)/g;
const LEAD_STRIP=/^(있는|없는|한편|따라서|따라|또한|의하면|의하여|의하는|의한|규정하고|규정한|소정의|정하는|정한|현행|당시)+/;
function cleanLawName(n){let p=n;while(LEAD_STRIP.test(p)){const q=p.replace(LEAD_STRIP,'');if(q.length<3||q===p)break;p=q;}return p;}
function mapText(t,fn){return String(t).split(/(<[^>]*>)/g).map(s=>s.charAt(0)==='<'?s:fn(s)).join('');}
function linkCase(t){
  return mapText(t,s=>s.replace(CASE_RE,(m,ts,yy,mk,no)=>
    `<a class="cl" data-case="${(ts?'조심':'')+yy+mk+no}">${m}</a>`));
}
function linkLaw(t,selfName){
  let last='';
  const baseOf=n=>n.replace(/\s*(시행령|시행규칙)$/,'').trim();
  return mapText(t,s=>s.replace(LAW_RE,(m,gu,nm,shy,par,parIn,jo)=>{
    let name='';
    const ana=nm&&/^(같은\s*법|같은법|동\s*법|이\s*법)$/.test(nm);
    if(nm&&!ana)name=cleanLawName(nm.trim());
    else if(ana&&last)name=baseOf(last);
    else if(!nm&&shy&&last)name=baseOf(last);
    else if(!nm&&!shy){
      if(selfName)return `<a class="jl" data-jo="${esc(jo)}">${m}</a>`;  // 같은 문서 내 조문 점프
      if(!last)return m;name=last;
    }
    if(!name)return m;
    if(shy)name=name+' '+shy.trim();
    last=name;
    let old='';
    if(par){const dm=(parIn||'').match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
      if(dm)old=dm[1]+String(dm[2]).padStart(2,'0')+String(dm[3]).padStart(2,'0');}
    return `<a class="ll" data-law="${esc(name)}" data-jo="${esc(jo)}" data-old="${old}">${m}</a>`;
  }));
}
function linkAll(t,selfName){return linkLaw(linkCase(t),selfName);}

/* 판례 만연체 가독화 (데스크톱 검증 규칙 이식) — 문장마다 문단 */
function readable(t){
  t=t.replace(/\(\s*((?:당원|대법원|헌법재판소|각급법원|서울고등법원|조세심판원)[^()<]{0,80}?(?:판결|결정)[^()<]{0,10}?)\)/g,
    '(<span class="cite">$1</span>)');
  t=linkAll(t);
  var SEP=String.fromCharCode(1);
  t=t.replace(/(다\.)(&quot;|")?\s+(?=[^\s<])/g,function(m,a,q){return a+(q||'')+SEP;});
  t=t.replace(/(<\/span>\)[,\u3001])\s+/g,'$1<br>');
  t=t.replace(/([,)])\s+(그러나|따라서|한편|또한|나아가|살피건대|그렇다면|그러므로|이와\s*같이)\s/g,'$1<br>$2 ');
  t=t.replace(/(하였으나,|하였는바,|것인바,|배척하였는바,|인정한 다음,|승인을 받은 다음|주장에 대하여,|의하면,)\s*/g,'$1<br>');
  return t.split(SEP).map(function(p){
    p=p.replace(/^\s*(\d{1,2}\.\s*|\[\d{1,2}\]\s*)/,'<span class="pnum">$1</span>');
    return '<div class="sent">'+p+'</div>';
  }).join('');
}

/* 노트 리치 렌더러 (nv* 마커) */
function noteRich(body){
  let t=esc(body||'');
  t=linkAll(t);
  t=t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/「([^」]{1,160}?)」/g,'<span class="nvQuote">「$1」</span>');
  const out=[];let flow=[];
  const flush=()=>{if(flow.length){out.push('<div class="nvFlow">'+flow.join('<br>')+'</div>');flow=[];}};
  for(const raw of t.split('\n')){
    const line=raw.replace(/\s+$/,'');let m;
    if((m=line.match(/^━+\s*(.+?)\s*━+$/))){flush();out.push('<div class="nvSec">'+m[1]+'</div>');continue;}
    if((m=line.match(/^■\s?(.*)$/))){flush();out.push('<div class="nvLead">'+m[1]+'</div>');continue;}
    if((m=line.match(/^([①-⑳])\s?(.*)$/))){flush();out.push('<div class="nvItem"><span class="nvNum">'+m[1]+'</span><span style="flex:1">'+m[2]+'</span></div>');continue;}
    if((m=line.match(/^(→|⇒)\s?(.*)$/))){flush();out.push('<div class="nvExp">'+m[2]+'</div>');continue;}
    if(/^\d\.\s/.test(line)){flush();out.push('<div class="nvTake">'+line+'</div>');continue;}
    if(/^\s+→/.test(raw)){flow.push(line.trim());continue;}
    if(line===''){flush();out.push('<div class="nvGap"></div>');continue;}
    if(/→/.test(line)&&line.length<70&&!/(다\.|이다|한다)/.test(line)){flow.push(line);continue;}
    flush();out.push('<div class="nvP">'+line+'</div>');
  }
  flush();return out.join('');
}

/* ============================ 화면 스택 ============================ */
const S={stack:[],fwd:[]};
function screen(){return S.stack[S.stack.length-1];}
function go(sc,replace){
  if(S.stack.length)S.stack[S.stack.length-1].sy=window.scrollY;   // 떠나는 화면 스크롤 저장
  if(replace&&S.stack.length){S.stack[S.stack.length-1]=sc;history.replaceState({i:S.stack.length},'','#'+S.stack.length);}
  else{S.stack.push(sc);history.pushState({i:S.stack.length},'','#'+S.stack.length);}
  S.fwd=[];render();window.scrollTo(0,0);
}
function goBack(){history.back();}
window.addEventListener('popstate',e=>{
  const i=Math.max(1,(e.state&&e.state.i)||1);
  if(i<S.stack.length){                                    // 뒤로가기
    while(S.stack.length>i)S.fwd.push(S.stack.pop());
    render();restoreScroll();
  }else if(i>S.stack.length&&S.fwd.length){                // 앞으로가기(fwd 캐시 복원)
    while(S.stack.length<i&&S.fwd.length)S.stack.push(S.fwd.pop());
    render();restoreScroll();
  }
});
function restoreScroll(){
  const sc=screen();const sy=(sc&&sc.sy)||0;
  requestAnimationFrame(()=>window.scrollTo(0,sy));
}
function navTo(type){
  const n=S.stack.length;
  S.stack=[{type}];S.fwd=[];
  render();window.scrollTo(0,0);
  if(n>1)history.go(-(n-1));                               // 히스토리를 #1로 되감기(popstate는 no-op)
  else history.replaceState({i:1},'','#1');
}
function setTop(title){
  $('topTitle').textContent=title;
  $('backBtn').style.display=S.stack.length>1?'':'none';
  ['home','files','recent','allnotes'].forEach(k=>{
    const b=$('nb-'+(k==='allnotes'?'notes':k));

function pushRecent(row){
  let a=[];try{a=JSON.parse(localStorage.mob_recent||'[]')}catch(e){}
  a=a.filter(x=>!(x.mst===row.mst&&x.target===row.target));
  a.unshift({target:row.target,law_id:row.law_id,mst:row.mst,name:row.name,label:row.target_label||'',ts:Date.now()});
  localStorage.mob_recent=JSON.stringify(a.slice(0,40));
  syncRecents(true);                                   // 서버에도 반영(폰·PC 공유)
}
function recents(){try{return JSON.parse(localStorage.mob_recent||'[]')}catch(e){return[]}}
/* 최근 목록을 서버(ui_state)와 병합 동기화 — 기기별 localStorage 한계 극복 */
let _recSyncBusy=false;
async function syncRecents(push){
  if(_recSyncBusy)return recents();
  _recSyncBusy=true;
  try{
    const d=await api('/api/ui_state/mob_recent',{});
    const server=((d&&d.data)||{}).items||[];
    const local=recents();
    const key=x=>(x.target||'')+'|'+(x.mst||'')+'|'+(x.law_id||'');
    const map={};
    server.concat(local).forEach(x=>{const k=key(x);if(!map[k]||(x.ts||0)>(map[k].ts||0))map[k]=x;});
    const merged=Object.values(map).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,40);
    localStorage.mob_recent=JSON.stringify(merged);
    if(push||merged.length!==server.length){
      fetch('/api/ui_state/mob_recent',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items:merged})}).catch(()=>{});
    }
    return merged;
  }catch(e){return recents();}
  finally{_recSyncBusy=false;}
}
function timeAgo(ts){
  if(!ts)return '';
  const s=(Date.now()-ts)/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+'분 전';
  if(s<86400)return Math.round(s/3600)+'시간 전';
  if(s<86400*2)return '어제';
  return Math.round(s/86400)+'일 전';
}

async function openLawName(name,jo,old){
  if($('load').style.display==='flex')return;

    if(old){
      const d=await api('/api/search',{target:'eflaw',query:name,display:'50',nw:'1',ancyd:'19000101~'+old,sort:'efdes'});
      const items=(d.normalized||{}).items||[];

      const it=items.find(x=>flat(x.name)===flat(name))||items[0];
      if(it){openDoc({target:'eflaw',law_id:it.law_id||it.mst,mst:it.mst||it.law_id,name:it.name||name,
        effective_date:it.effective_date||'',target_label:'연혁법령'},jo);return;}

    }
    const d=await api('/api/title_search',{query:name,targets:'eflaw',display:'10'});
    const items=d.items||[];const flat=s=>(s||'').replace(/\s+/g,'');

        <div>${noteRich(n.body||'')}</div>
      </div>`).join('')
    :'<div class="empty">노트가 없습니다.</div>'}</div>`;
  window._notes={};items.forEach(n=>window._notes[n.id]=n);
  if(sc.sy!=null){const y=sc.sy;sc.sy=null;requestAnimationFrame(()=>window.scrollTo(0,y));}
}
function openNoteDocFromList(ev,id){
  ev.preventDefault();ev.stopPropagation();
  const n=(window._notes||{})[id];if(!n)return false;
  openDoc({target:n.target||'eflaw',law_id:n.law_id||'',mst:n.mst||'',name:n.law_name||'문서',target_label:TL[n.target]||''},n.article||'');
  return false;
}

/* ============================ 화면: 자료(읽을것들) ============================ */
function fmtSize(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function renderFiles(sc){
  setTop('📚 자료 (읽을것들)');
  // 항상-최신 목록 페이지를 그대로 표시. 문서로 들어가면 페이지 좌하단 [← 목록]으로 복귀.
  $('app').innerHTML=`<div style="position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 62px);background:var(--bg)">
    <iframe src="/readables_index" style="width:100%;height:100%;border:0" title="읽을것들 목록"></iframe></div>`;
}
function renderFileView(sc){
  setTop(sc.name||'문서');
  const url='/readables/'+String(sc.path).split('/').map(encodeURIComponent).join('/')+'?m=1';
  $('app').innerHTML=`<div style="position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 62px);background:var(--card)">
    <iframe src="${url}" style="width:100%;height:100%;border:0" title="${esc(sc.name||'')}"></iframe></div>
    <button onclick='window.open(${JSON.stringify(url)},"_blank")'
      style="position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 60px);z-index:60;border:0;border-radius:10px;background:rgba(30,35,60,.55);color:#fff;padding:7px 11px;font-size:12.5px;font-weight:700">새 탭 ↗</button>`;
}

/* ============================ 렌더 루프 ============================ */
function render(){
  const sc=screen();if(!sc)return;
  if(sc.type==='home'){setTop('판례 리더');$('app').innerHTML=homeHtml();if(S.q){if(S.hitsHtml)$('hits').innerHTML=S.hitsHtml;else doSearch();}}
  else if(sc.type==='recent'){setTop('최근 본 문서');$('app').innerHTML=recentHtml();}
  else if(sc.type==='allnotes'){renderNotes({type:'notes',row:null});return;}
  else if(sc.type==='doc'){renderDoc(sc);}
  else if(sc.type==='notes'){renderNotes(sc);}
  else if(sc.type==='files'){renderFiles(sc);}
  else if(sc.type==='file'){renderFileView(sc);}
  setTop($('topTitle').textContent);
}
try{history.scrollRestoration='manual';}catch(e){}
S.stack=[{type:'home'}];
history.replaceState({i:1},'','#1');
render();
syncRecents().then(m=>{const sc=screen();if(sc&&sc.type==='home'&&m.length&&!document.querySelector('#hits .hit'))render();});
</script>
